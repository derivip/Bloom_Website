<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youth Support & Task Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Youth Support Hub</h1>
        <p>Your adaptive task dashboard and resource platform</p>
    </header>

    <main>
        <section class="dashboard">
            <h2>Task Dashboard</h2>
            <div class="task-input">
                <input type="text" id="taskInput" placeholder="Add a new task or goal...">
                <button id="addTaskBtn">Add Task</button>
            </div>
            <ul id="taskList">
                <!-- Dynamic tasks will appear here -->
            </ul>
        </section>

        <section class="resources">
            <h2>Quick Resources</h2>
            <ul>
                <li><a href="#" target="_blank">Career Coaching & Resume Building</a></li>
                <li><a href="#" target="_blank">Mental Health & Wellness Support</a></li>
                <li><a href="#" target="_blank">Tech Skills & Certifications Guide</a></li>
            </ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
